name: Deploy to GitHub Pages (user site)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate and verify site
        run: |
          python3 build.py
          python3 verify.py

      - name: Check cross-repository deploy token
        env:
          GH_PAGES_TOKEN: ${{ secrets.GH_PAGES_TOKEN }}
        run: |
          if [ -z "$GH_PAGES_TOKEN" ]; then
            echo "::error::Missing GH_PAGES_TOKEN. Add a fine-grained personal access token with Contents: Read and write access to Zackkaz/zackkaz.github.io under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Deploy to zackkaz.github.io
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Zackkaz/zackkaz.github.io
          publish_dir: ./public
          publish_branch: main
