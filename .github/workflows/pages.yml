name: Deploy to GitHub Pages (user site)

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write   # needed by peaceiris/actions-gh-pages to push to the target repo

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate site (BASE="" -> serves at true origin root)
        run: python3 build.py

      - name: Deploy to zackkaz.github.io (user Pages, root)
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Personal Access Token with repo scope is required to push to a
          # DIFFERENT repository (the user Pages repo). The default
          # GITHUB_TOKEN cannot write to another repo. Provide it as a secret
          # named GH_PAGES_TOKEN (Settings -> Secrets -> Actions), then switch
          # the line below. If absent, this step fails with a permission error.
          personal_token: ${{ secrets.GH_PAGES_TOKEN }}
          external_repository: Zackkaz/zackkaz.github.io
          publish_dir: ./public
          publish_branch: main
